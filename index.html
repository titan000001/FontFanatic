<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ransom Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex flex-col overflow-hidden font-mono">
    <!-- App Content -->
    <div id="app-root" class="flex-1 flex flex-col p-6 gap-6 max-w-7xl mx-auto w-full">
        <!-- Header / Control Bar -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-4xl text-red-500 font-bold uppercase tracking-widest drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]" style="font-family: 'Rubik Glitch', 'Courier New', monospace;">
                    The Ransom Engine
                </h1>
                <p class="text-xs text-gray-500 font-mono mt-1">Status: <span id="status-indicator" class="text-green-500">Initializing...</span></p>
            </div>

            <div class="flex flex-wrap gap-3 items-center">
                <!-- Background Controls -->
                <div class="flex items-center gap-2 bg-gray-800 p-1 rounded-sm border border-gray-700">
                    <select id="bg-texture-select" class="bg-transparent text-xs text-gray-300 outline-none cursor-pointer">
                        <option value="cork">Corkboard</option>
                        <option value="cardboard">Cardboard</option>
                        <option value="concrete">Concrete</option>
                        <option value="paper">Paper</option>
                        <option value="color">Solid Color</option>
                        <option value="custom">Custom Image...</option>
                    </select>
                    <input type="color" id="bg-color-input" value="#111827" class="w-6 h-6 p-0 border-0 bg-transparent cursor-pointer">
                    <input type="file" id="bg-image-input" accept="image/*" class="hidden">
                    <button id="btn-bg-upload" title="Upload Image" class="text-gray-400 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                    </button>
                </div>

                <div class="h-6 w-px bg-gray-700 mx-2"></div>

                <!-- Filename Input -->
                <input type="text" id="filename-input" placeholder="filename"
                    class="bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-sm px-3 py-2 outline-none focus:border-red-500 font-mono w-32 placeholder-gray-600 transition-colors">

                <!-- Export Buttons -->
                <button id="btn-copy-html" class="group relative px-4 py-2 bg-gray-900 border border-cyan-500/50 text-cyan-400 font-mono text-sm uppercase tracking-wide hover:bg-cyan-900/20 hover:border-cyan-400 transition-all">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy HTML
                    </span>
                    <div class="absolute inset-0 bg-cyan-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>

                <button id="btn-export-jpg" class="group relative px-4 py-2 bg-gray-900 border border-red-500/50 text-red-400 font-mono text-sm uppercase tracking-wide hover:bg-red-900/20 hover:border-red-400 transition-all">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        JPG
                    </span>
                    <div class="absolute inset-0 bg-red-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>

                <button id="btn-open-video-modal" class="group relative px-4 py-2 bg-gray-900 border border-purple-500/50 text-purple-400 font-mono text-sm uppercase tracking-wide hover:bg-purple-900/20 hover:border-purple-400 transition-all">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Video
                    </span>
                    <div class="absolute inset-0 bg-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
            </div>
        </header>

        <!-- Video Settings Modal -->
        <div id="video-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm">
            <div class="bg-gray-900 border border-purple-500 p-6 rounded-sm shadow-[0_0_20px_rgba(168,85,247,0.5)] max-w-md w-full relative">
                <button id="btn-close-modal" class="absolute top-2 right-2 text-gray-500 hover:text-white">&times;</button>
                <h2 class="text-xl text-purple-400 font-bold uppercase tracking-widest mb-4">Export Video Timelapse</h2>

                <div class="space-y-4">
                    <!-- Style Selection -->
                    <div>
                        <label class="block text-xs text-gray-400 font-mono uppercase mb-2">Video Style</label>
                        <div class="flex gap-2">
                            <button class="style-btn flex-1 py-2 border border-gray-600 text-gray-400 text-sm hover:border-purple-500 hover:text-purple-400 transition-all active" data-style="timelapse">Timelapse</button>
                            <button class="style-btn flex-1 py-2 border border-gray-600 text-gray-400 text-sm hover:border-purple-500 hover:text-purple-400 transition-all" data-style="flash">Flash (Zoom)</button>
                        </div>
                    </div>

                    <!-- Granularity Selection -->
                    <div>
                        <label class="block text-xs text-gray-400 font-mono uppercase mb-2">Granularity</label>
                        <div class="flex gap-2">
                            <button class="mode-btn flex-1 py-2 border border-gray-600 text-gray-400 text-sm hover:border-purple-500 hover:text-purple-400 transition-all active" data-mode="char">Character</button>
                            <button class="mode-btn flex-1 py-2 border border-gray-600 text-gray-400 text-sm hover:border-purple-500 hover:text-purple-400 transition-all" data-mode="word">Word</button>
                        </div>
                    </div>

                    <!-- Speed Selection -->
                    <div>
                        <label class="block text-xs text-gray-400 font-mono uppercase mb-2">Speed (FPS): <span id="fps-display" class="text-white">10</span></label>
                        <input type="range" id="fps-input" min="1" max="30" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
                    </div>

                    <!-- Generate Button -->
                    <button id="btn-generate-video" class="w-full py-3 bg-purple-900/50 border border-purple-500 text-purple-300 font-bold uppercase tracking-widest hover:bg-purple-500 hover:text-white transition-all">
                        Render Video
                    </button>

                    <!-- Progress Bar -->
                    <div id="progress-container" class="hidden mt-4">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Processing...</span>
                            <span id="progress-text">0%</span>
                        </div>
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-purple-500 h-full w-0 transition-all duration-100"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col md:flex-row gap-6 min-h-0">
            <!-- Left: Input -->
            <div class="w-full md:w-1/3 flex flex-col gap-2">
                <label for="user-input" class="text-xs text-gray-400 font-mono uppercase tracking-wider">Target Message</label>
                <textarea id="user-input"
                    class="flex-1 w-full bg-gray-800/50 border border-gray-700 text-gray-200 p-4 font-mono text-lg resize-none outline-none focus:border-red-500/50 focus:bg-gray-800 transition-all rounded-sm"
                    placeholder="Type your ransom note here..."></textarea>
                <div class="text-xs text-gray-600 text-right font-mono" id="char-count">0 chars</div>
            </div>

            <!-- Right: Output Canvas -->
            <div class="w-full md:w-2/3 bg-gray-800 rounded-sm border border-gray-700 relative overflow-hidden flex flex-col">
                <div class="absolute top-0 left-0 bg-gray-900 text-gray-500 text-[10px] px-2 py-1 font-mono border-b border-r border-gray-700 z-10">
                    PREVIEW
                </div>

                <!-- Scrollable Wrapper -->
                <div class="flex-1 overflow-auto p-8 flex items-center justify-center bg-gray-900">
                    <!-- The Ransom Note Container (The element to export) -->
                    <div id="ransom-output" class="texture-cork shadow-[0_10px_30px_rgba(0,0,0,0.5)] min-w-[300px] min-h-[300px] p-8 max-w-full transform transition-transform duration-200 origin-center bg-cover bg-center">
                        <div id="ransom-content" class="flex flex-wrap gap-x-1 gap-y-2 content-start break-words whitespace-pre-wrap leading-relaxed">
                            <!-- Spans will go here -->
                            <span class="font-mono text-gray-800 opacity-50 text-sm">Waiting for input...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Logic Scripts -->
    <script src="js/fonts.js"></script>
    <script src="js/video.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
